name: Pages

# Set Pages to build from "GitHub Actions" once in the repository settings;
# with "Deploy from a branch" the deploy step fails with a bare 404.
#
# Publishes the website at the root and the web app under /app/.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'app/**'
      - 'docs/img/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build the web app and the site
        run: |
          set -eu
          npm run build -w app
          npm run build -w site
          mkdir -p site/dist/app
          cp -r app/dist/. site/dist/app/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
