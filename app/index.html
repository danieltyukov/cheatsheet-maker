<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cheatsheet Maker</title>
    <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Turn screenshots, lecture slides, notes and formulas into a dense, printable cheatsheet." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      try {
        var t = localStorage.getItem('cm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
